<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">ADPS Agent 设计模式地图</title>
  <desc id="desc">用双轴坐标和四个核心模块展示 Agent 设计模式的学习框架。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#223" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1120" height="640" rx="20" fill="url(#bg)"/>
  <text x="560" y="54" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#1f2937">Agent 设计模式：从范式到工程闭环</text>
  <text x="560" y="88" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#667085">认知功能 x 执行拓扑，先定位问题，再选择模式</text>

  <line x1="170" y1="510" x2="950" y2="510" stroke="#344054" stroke-width="2"/>
  <line x1="170" y1="510" x2="170" y2="130" stroke="#344054" stroke-width="2"/>
  <polygon points="950,510 934,502 934,518" fill="#344054"/>
  <polygon points="170,130 162,146 178,146" fill="#344054"/>
  <text x="960" y="516" font-size="15" font-family="Arial, sans-serif" fill="#344054">执行拓扑复杂度</text>
  <text x="118" y="124" font-size="15" font-family="Arial, sans-serif" fill="#344054">认知功能复杂度</text>

  <g filter="url(#shadow)">
    <rect x="230" y="355" width="185" height="92" rx="8" fill="#ffffff" stroke="#98a2b3"/>
    <text x="322" y="386" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#175cd3">感知</text>
    <text x="322" y="416" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#475467">分诊、压缩、发现、多模态</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="330" width="185" height="92" rx="8" fill="#ffffff" stroke="#98a2b3"/>
    <text x="562" y="361" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#067647">记忆</text>
    <text x="562" y="391" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#475467">分层、检索、进度、失败日记</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="595" y="205" width="185" height="92" rx="8" fill="#ffffff" stroke="#98a2b3"/>
    <text x="687" y="236" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#b54708">推理</text>
    <text x="687" y="266" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#475467">思维链、路由、并行、验证</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="800" y="165" width="185" height="92" rx="8" fill="#ffffff" stroke="#98a2b3"/>
    <text x="892" y="196" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#7a271a">行动</text>
    <text x="892" y="226" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#475467">工具准入、规划执行、安全恢复</text>
  </g>

  <path d="M415 400 C455 392 445 380 470 374" fill="none" stroke="#98a2b3" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M655 364 C690 342 670 314 687 298" fill="none" stroke="#98a2b3" stroke-width="2"/>
  <path d="M780 250 C812 240 802 218 800 210" fill="none" stroke="#98a2b3" stroke-width="2"/>

  <rect x="235" y="555" width="650" height="44" rx="8" fill="#f2f4f7" stroke="#d0d5dd"/>
  <text x="560" y="583" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#344054">落地顺序：问题定位 -> 模式选择 -> 可观测实现 -> 评估迭代</text>
</svg>
