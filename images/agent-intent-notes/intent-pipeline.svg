<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent 意图识别流水线</title>
  <desc id="desc">从用户原始输入到规范化、候选意图、三层识别、拒识澄清、槽位填充和执行计划的流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#38516b"/>
    </marker>
    <style>
      .panel { fill: url(#bg); stroke: #d8e1ea; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #8aa3b7; stroke-width: 2; rx: 10; }
      .accent { fill: #eef7f1; stroke: #5b9a70; }
      .warn { fill: #fff3e6; stroke: #d28b42; }
      .title { font: 700 28px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #203040; }
      .label { font: 700 19px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #253447; }
      .small { font: 15px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #4b6175; }
      .arrow { stroke: #38516b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="20" y="20" width="1080" height="480" rx="22" class="panel"/>
  <text x="58" y="72" class="title">Agent 意图识别：先把话听懂，再决定怎么做</text>
  <text x="58" y="104" class="small">核心判断：用户想完成什么目标？系统应该用什么动作承接？不确定时先拒识或澄清。</text>

  <rect x="58" y="158" width="150" height="110" class="box"/>
  <text x="88" y="195" class="label">原始输入</text>
  <text x="82" y="226" class="small">省略、指代</text>
  <text x="82" y="250" class="small">模糊、口语化</text>

  <path d="M210 213 H268" class="arrow"/>
  <rect x="278" y="158" width="160" height="110" class="box"/>
  <text x="308" y="195" class="label">输入规范化</text>
  <text x="306" y="226" class="small">补全上下文</text>
  <text x="306" y="250" class="small">消解“那个”</text>

  <path d="M440 213 H498" class="arrow"/>
  <rect x="508" y="142" width="210" height="142" class="box accent"/>
  <text x="552" y="179" class="label">三层识别</text>
  <text x="536" y="212" class="small">1. 规则兜底</text>
  <text x="536" y="236" class="small">2. 小模型/分类器</text>
  <text x="536" y="260" class="small">3. LLM 语义判断</text>

  <path d="M720 213 H778" class="arrow"/>
  <rect x="788" y="142" width="250" height="142" class="box"/>
  <text x="850" y="179" class="label">结构化结果</text>
  <text x="816" y="212" class="small">intent + confidence</text>
  <text x="816" y="236" class="small">slots + constraints</text>
  <text x="816" y="260" class="small">reason + next_action</text>

  <path d="M613 286 V342 H274 V314" class="arrow"/>
  <rect x="118" y="330" width="310" height="104" class="box warn"/>
  <text x="164" y="367" class="label">拒识 / 澄清</text>
  <text x="146" y="398" class="small">低置信度、边界重叠、多目标冲突时，</text>
  <text x="146" y="422" class="small">先问清楚，不急着执行。</text>

  <path d="M914 286 V342" class="arrow"/>
  <rect x="760" y="352" width="310" height="82" class="box accent"/>
  <text x="822" y="388" class="label">进入 Plan / Tool</text>
  <text x="792" y="418" class="small">把“想做什么”转成可执行步骤和工具选择。</text>
</svg>
