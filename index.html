<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jotaro Space</title>
  <link rel="icon" href="/images/site-avatar-256.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #111827 url("/images/first-screen.jpg") center/cover fixed no-repeat;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(15, 23, 42, .78), rgba(15, 23, 42, .36));
    }
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      align-content: center;
      max-width: 960px;
      padding: 64px clamp(24px, 6vw, 88px);
    }
    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .78);
      object-fit: cover;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 84px);
      line-height: 1;
      letter-spacing: 0;
    }
    p {
      max-width: 640px;
      margin: 22px 0 0;
      color: #dbeafe;
      font-size: clamp(18px, 2.5vw, 24px);
      line-height: 1.7;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, .58);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      background: rgba(15, 23, 42, .28);
      backdrop-filter: blur(8px);
    }
    a:hover { background: rgba(255, 255, 255, .16); }
  </style>
</head>
<body>
  <main>
    <img   class="avatar"   src="/images/site-avatar-256.png"   alt="JotaroRD">
    <h1>Jotaro Space</h1>
    <p>Talk is Cheap. 文章已清空，站点入口保留中。</p>
    <nav>
      <a href="/about/">About</a>
      <a href="/categories/">Categories</a>
      <a href="/tags/">Tags</a>
      <a href="/algorithms/">Algorithms</a>
    </nav>
  </main>
</body>
</html>
