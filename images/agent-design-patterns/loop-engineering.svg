<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop Engineering 闭环</title>
  <desc id="desc">展示 Agent 从感知输入到计划、执行、观察、记忆和评估的工程循环。</desc>
  <rect width="1120" height="560" rx="20" fill="#fbfcfe"/>
  <text x="560" y="54" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#1f2937">Loop Engineering：把 Agent 循环工程化</text>
  <text x="560" y="86" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#667085">每一轮都要留下输入、决策、动作、证据和恢复路径</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="210" width="150" height="88" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="165" y="245" text-anchor="middle" font-size="19" font-weight="700" fill="#075985">感知输入</text>
    <text x="165" y="274" text-anchor="middle" font-size="13" fill="#075985">上下文分诊</text>

    <rect x="295" y="130" width="150" height="88" rx="8" fill="#dcfae6" stroke="#32d583"/>
    <text x="370" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#05603a">状态记忆</text>
    <text x="370" y="194" text-anchor="middle" font-size="13" fill="#05603a">进度与证据链</text>

    <rect x="500" y="210" width="150" height="88" rx="8" fill="#fef0c7" stroke="#fdb022"/>
    <text x="575" y="245" text-anchor="middle" font-size="19" font-weight="700" fill="#93370d">推理计划</text>
    <text x="575" y="274" text-anchor="middle" font-size="13" fill="#93370d">复杂度路由</text>

    <rect x="705" y="130" width="150" height="88" rx="8" fill="#fee4e2" stroke="#f97066"/>
    <text x="780" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#912018">工具执行</text>
    <text x="780" y="194" text-anchor="middle" font-size="13" fill="#912018">准入与回滚</text>

    <rect x="875" y="300" width="150" height="88" rx="8" fill="#ebe9fe" stroke="#9b8afb"/>
    <text x="950" y="335" text-anchor="middle" font-size="19" font-weight="700" fill="#5925dc">观察评估</text>
    <text x="950" y="364" text-anchor="middle" font-size="13" fill="#5925dc">是否收敛</text>

    <rect x="500" y="390" width="150" height="88" rx="8" fill="#f2f4f7" stroke="#98a2b3"/>
    <text x="575" y="425" text-anchor="middle" font-size="19" font-weight="700" fill="#344054">失败日记</text>
    <text x="575" y="454" text-anchor="middle" font-size="13" fill="#344054">复盘与模式沉淀</text>
  </g>

  <path d="M240 238 C270 205 265 178 295 174" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M445 174 C480 180 482 228 500 244" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M650 238 C690 205 680 178 705 174" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M855 190 C908 218 935 260 948 300" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M875 360 C790 418 712 433 650 435" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M500 435 C355 432 220 355 176 298" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#arrow)"/>

  <text x="560" y="520" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#475467">关键工程约束：每次循环都要可观测、可中断、可恢复、可复盘</text>
</svg>
