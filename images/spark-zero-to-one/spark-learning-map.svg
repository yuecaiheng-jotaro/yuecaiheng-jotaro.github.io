<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Spark 学习路线图</title>
  <desc id="desc">从 Spark 基础到 Spark SQL、MLlib、Structured Streaming 和性能诊断的学习路线。</desc>
  <rect width="1120" height="640" rx="20" fill="#fbfcfe"/>
  <text x="560" y="54" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" font-weight="700" fill="#101828">零基础入门 Spark：学习路线图</text>
  <text x="560" y="88" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#667085">先理解分布式计算，再掌握 SQL、机器学习、流处理和诊断能力</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#667085"/>
    </marker>
  </defs>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="215" width="175" height="112" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="157" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">基础知识</text>
    <text x="157" y="282" text-anchor="middle" font-size="13" fill="#344054">RDD / 算子 / 调度</text>
    <text x="157" y="306" text-anchor="middle" font-size="13" fill="#344054">Shuffle / 内存 / 存储</text>

    <rect x="295" y="165" width="175" height="112" rx="8" fill="#dcfae6" stroke="#32d583"/>
    <text x="382" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#05603a">Spark SQL</text>
    <text x="382" y="232" text-anchor="middle" font-size="13" fill="#344054">DataFrame / 数据源</text>
    <text x="382" y="256" text-anchor="middle" font-size="13" fill="#344054">Join / Hive / UI</text>

    <rect x="520" y="215" width="175" height="112" rx="8" fill="#fef0c7" stroke="#fdb022"/>
    <text x="607" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#93370d">MLlib</text>
    <text x="607" y="282" text-anchor="middle" font-size="13" fill="#344054">特征工程 / 训练</text>
    <text x="607" y="306" text-anchor="middle" font-size="13" fill="#344054">Pipeline / 评估</text>

    <rect x="745" y="165" width="175" height="112" rx="8" fill="#ebe9fe" stroke="#9b8afb"/>
    <text x="832" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#5925dc">Streaming</text>
    <text x="832" y="232" text-anchor="middle" font-size="13" fill="#344054">微批 / 连续处理</text>
    <text x="832" y="256" text-anchor="middle" font-size="13" fill="#344054">窗口 / Watermark</text>

    <rect x="430" y="420" width="260" height="82" rx="8" fill="#fee4e2" stroke="#f97066"/>
    <text x="560" y="454" text-anchor="middle" font-size="20" font-weight="700" fill="#912018">性能诊断与生产化</text>
    <text x="560" y="482" text-anchor="middle" font-size="13" fill="#344054">Spark UI / 配置 / 稳定性 / 成本</text>
  </g>
  <path d="M245 260 H295" stroke="#667085" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M470 228 C500 225 500 262 520 270" stroke="#667085" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M695 260 H745" stroke="#667085" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M382 277 C405 345 480 395 530 420" stroke="#667085" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M832 277 C808 345 700 395 615 420" stroke="#667085" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="574" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#475467">实战抓手：Word Count -> 小汽车摇号分析 -> 房价预测 -> 流式 Word Count -> Spark UI 排障</text>
</svg>
