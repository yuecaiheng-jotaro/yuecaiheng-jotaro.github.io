<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG 知识库检索插画</title>
  <desc id="desc">展示文档、知识切片、向量空间、检索与引用回答之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="48%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="74" font-size="38" font-weight="800" fill="#0f172a">RAG 的本质：让回答站在证据上</text>
    <text x="66" y="116" font-size="22" fill="#475569">文档不是直接塞给模型，而是先切片、检索、重排，再带引用生成答案。</text>
  </g>

  <g transform="translate(88 174)" filter="url(#shadow)">
    <rect width="234" height="348" rx="24" fill="#ffffff"/>
    <rect x="26" y="28" width="182" height="40" rx="12" fill="#bae6fd"/>
    <rect x="28" y="100" width="174" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="28" y="136" width="144" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="28" y="172" width="166" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="28" y="238" width="182" height="68" rx="16" fill="#fef3c7"/>
    <text x="117" y="331" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">原始文档</text>
  </g>

  <g transform="translate(380 184)" filter="url(#shadow)">
    <rect x="0" y="0" width="172" height="96" rx="20" fill="url(#card)"/>
    <rect x="38" y="126" width="172" height="96" rx="20" fill="#ecfeff"/>
    <rect x="-20" y="252" width="172" height="96" rx="20" fill="#fff7ed"/>
    <g fill="#64748b">
      <rect x="28" y="30" width="112" height="12" rx="6"/>
      <rect x="28" y="56" width="86" height="12" rx="6"/>
      <rect x="66" y="156" width="112" height="12" rx="6"/>
      <rect x="66" y="182" width="76" height="12" rx="6"/>
      <rect x="8" y="282" width="112" height="12" rx="6"/>
      <rect x="8" y="308" width="92" height="12" rx="6"/>
    </g>
    <text x="84" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">知识切片</text>
  </g>

  <g stroke="#94a3b8" stroke-width="3" fill="none" opacity="0.75">
    <path d="M326 344 C356 310 362 286 386 258"/>
    <path d="M326 344 C366 354 386 366 412 386"/>
    <path d="M552 232 C620 202 640 206 696 226"/>
    <path d="M552 360 C630 392 650 394 716 372"/>
  </g>

  <g transform="translate(664 168)">
    <circle cx="152" cy="176" r="150" fill="#0f172a" opacity="0.92" filter="url(#shadow)"/>
    <g stroke="#67e8f9" stroke-width="2" opacity="0.92">
      <line x1="84" y1="112" x2="172" y2="78"/>
      <line x1="172" y1="78" x2="226" y2="150"/>
      <line x1="226" y1="150" x2="188" y2="238"/>
      <line x1="188" y1="238" x2="92" y2="220"/>
      <line x1="92" y1="220" x2="84" y2="112"/>
      <line x1="84" y1="112" x2="188" y2="238"/>
      <line x1="172" y1="78" x2="92" y2="220"/>
    </g>
    <g fill="#fef3c7">
      <circle cx="84" cy="112" r="11"/>
      <circle cx="172" cy="78" r="11"/>
      <circle cx="226" cy="150" r="11"/>
      <circle cx="188" cy="238" r="11"/>
      <circle cx="92" cy="220" r="11"/>
    </g>
    <circle cx="152" cy="176" r="46" fill="#22d3ee" opacity="0.24"/>
    <circle cx="152" cy="176" r="18" fill="#22d3ee"/>
    <text x="152" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">向量空间</text>
  </g>

  <g transform="translate(1002 206)" filter="url(#shadow)">
    <rect width="134" height="236" rx="24" fill="#ffffff"/>
    <circle cx="68" cy="54" r="26" fill="#14b8a6"/>
    <path d="M54 54 l10 10 l20 -24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="102" width="88" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="24" y="132" width="68" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="24" y="176" width="88" height="34" rx="12" fill="#dcfce7"/>
    <text x="67" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">引用回答</text>
  </g>
</svg>
