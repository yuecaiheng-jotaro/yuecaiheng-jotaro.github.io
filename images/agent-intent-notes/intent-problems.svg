<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">意图识别常见问题与工程解法</title>
  <desc id="desc">列出候选意图过多、边界重叠、多目标、多轮状态、识别器冲突五类问题及对应解法。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf7; }
      .title { font: 700 28px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #203040; }
      .sub { font: 15px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #5c6875; }
      .head { font: 700 18px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #253447; }
      .txt { font: 15px "PingFang SC", "Microsoft Yahei", Arial, sans-serif; fill: #445565; }
      .card { fill: #ffffff; stroke: #d7dfd2; stroke-width: 2; rx: 10; }
      .pill { fill: #eaf3ef; stroke: #79a88f; stroke-width: 1.5; rx: 16; }
      .line { stroke: #d7dfd2; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1120" height="620" class="bg"/>
  <text x="54" y="62" class="title">意图识别准确率问题：不要只怪模型</text>
  <text x="54" y="94" class="sub">很多“不准”来自意图体系、边界、状态管理和仲裁策略没有设计好。</text>

  <rect x="54" y="130" width="1012" height="78" class="card"/>
  <rect x="78" y="154" width="132" height="32" class="pill"/>
  <text x="100" y="176" class="head">候选太多</text>
  <text x="244" y="162" class="txt">问题：Prompt 放不下，模型注意力被稀释。</text>
  <text x="244" y="190" class="txt">解法：分层路由，先粗分类，再召回相关候选意图进入精排。</text>

  <rect x="54" y="228" width="1012" height="78" class="card"/>
  <rect x="78" y="252" width="132" height="32" class="pill"/>
  <text x="100" y="274" class="head">边界重叠</text>
  <text x="244" y="260" class="txt">问题：退款、投诉、补偿、咨询常常混在一句话里。</text>
  <text x="244" y="288" class="txt">解法：写清代表问、相似问、反例和承接动作，用业务动作划边界。</text>

  <rect x="54" y="326" width="1012" height="78" class="card"/>
  <rect x="78" y="350" width="132" height="32" class="pill"/>
  <text x="108" y="372" class="head">多目标</text>
  <text x="244" y="358" class="txt">问题：用户一句话可能同时要查状态、改地址、催进度。</text>
  <text x="244" y="386" class="txt">解法：允许多意图输出，拆主次目标，再让 Plan 决定执行顺序。</text>

  <rect x="54" y="424" width="1012" height="78" class="card"/>
  <rect x="78" y="448" width="132" height="32" class="pill"/>
  <text x="100" y="470" class="head">多轮状态</text>
  <text x="244" y="456" class="txt">问题：用户会延续、修改、切换、取消任务。</text>
  <text x="244" y="484" class="txt">解法：维护当前目标、历史目标和待确认约束，状态变化要显式记录。</text>

  <rect x="54" y="522" width="1012" height="78" class="card"/>
  <rect x="78" y="546" width="132" height="32" class="pill"/>
  <text x="92" y="568" class="head">结果冲突</text>
  <text x="244" y="554" class="txt">问题：规则、小模型、LLM 给出不同结论。</text>
  <text x="244" y="582" class="txt">解法：按风险、置信度、业务优先级做仲裁；高风险场景进入澄清。</text>
</svg>
